name: Release

on:
  push:
    branches: ['**']

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Sanitize signing key
        shell: bash
        run: |
          CLEAN_KEY=$(echo "$TAURI_SIGNING_PRIVATE_KEY_RAW" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_KEY"
          echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW" >> "$GITHUB_ENV"
        env:
          TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify signing key
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set"
            exit 1
          fi
          echo "sign-test" > "$RUNNER_TEMP/sign_test.txt"
          if npx tauri signer sign "$RUNNER_TEMP/sign_test.txt"; then
            echo "Signing key verified OK"
          else
            echo "::error::Signing key invalid. Check TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/sign_test.txt" "$RUNNER_TEMP/sign_test.txt.sig"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal target
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.version }}
          releaseName: "Qollect ${{ steps.version.outputs.version }}"
          releaseBody: "See the assets to download and install this version.\n\n> **Note:** Linux build is experimental — clipboard functionality is not yet implemented."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}

  upload-r2:
    needs: [release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_num=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p r2-upload/releases/${{ steps.version.outputs.version }}
          cd r2-upload/releases/${{ steps.version.outputs.version }}

          # Download all assets from the GitHub Release
          gh release download "${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.exe" \
            --pattern "*.exe.sig" \
            --pattern "*.dmg" \
            --pattern "*.dmg.sig" \
            --pattern "*.AppImage" \
            --pattern "*.AppImage.sig" \
            --pattern "*.deb" \
            --pattern "*.deb.sig" \
            --clobber || true

          echo "Downloaded assets:"
          ls -la

      - name: Generate R2 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          R2_BASE="https://dl.135070.xyz/releases/${VERSION}"

          # Download the tauri-generated latest.json from GitHub Release
          gh release download "$VERSION" \
            --repo "${{ github.repository }}" \
            --pattern "latest.json" \
            --dir r2-upload/tmp \
            --clobber

          # Replace GitHub download URLs with R2 URLs
          sed -E "s|https://github\.com/[^/]+/[^/]+/releases/download/[^/]+/|${R2_BASE}/|g" \
            r2-upload/tmp/latest.json > r2-upload/latest.json

          echo "Generated latest.json:"
          cat r2-upload/latest.json

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUCKET="qollect"

          # Upload latest.json
          wrangler r2 object put "${BUCKET}/latest.json" \
            --file r2-upload/latest.json \
            --content-type "application/json" \
            --remote

          # Upload all release assets
          for file in r2-upload/releases/${VERSION}/*; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            echo "Uploading: $filename"
            wrangler r2 object put "${BUCKET}/releases/${VERSION}/${filename}" \
              --file "$file" \
              --remote
          done

          echo "R2 upload complete: https://dl.135070.xyz/latest.json"
