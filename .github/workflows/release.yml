name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Disable Windows Defender
        shell: powershell
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath (Get-Location).Path -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction SilentlyContinue

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Enforce style token guard
        run: npm run lint:styles:strict

      - name: Sanitize signing key
        shell: bash
        run: |
          CLEAN_KEY=$(echo "$TAURI_SIGNING_PRIVATE_KEY_RAW" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN_KEY"
          echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW" >> "$GITHUB_ENV"
        env:
          TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify signing key
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set"
            exit 1
          fi
          echo "sign-test" > "$RUNNER_TEMP/sign_test.txt"
          if npx tauri signer sign "$RUNNER_TEMP/sign_test.txt"; then
            echo "Signing key verified OK"
          else
            echo "::error::Signing key invalid. Check TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            exit 1
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            tools/check-updater-signature -> target
          shared-key: "qollect-windows-build"
          save-if: ${{ github.ref == 'refs/heads/dev-fav' }}

      - name: Verify updater pubkey matches signing key
        shell: bash
        run: |
          cargo run --manifest-path tools/check-updater-signature/Cargo.toml -- \
            "$RUNNER_TEMP/sign_test.txt" \
            "$RUNNER_TEMP/sign_test.txt.sig" \
            "src-tauri/tauri.conf.json"
          rm -f "$RUNNER_TEMP/sign_test.txt" "$RUNNER_TEMP/sign_test.txt.sig"

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_num=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release metadata
        id: release_meta
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const version = process.env.VERSION;
          const notesPath = path.join(process.cwd(), 'src', 'data', 'release-notes.json');
          const raw = fs.readFileSync(notesPath, 'utf8');
          const notes = JSON.parse(raw);
          const release = Array.isArray(notes.releases)
            ? notes.releases.find((entry) => String(entry.version || '').trim() === version)
            : null;

          if (!release) {
            throw new Error(`Missing release-notes entry for ${version}`);
          }

          const summaryZh = String(release.summary?.['zh-CN'] || '').trim();
          const summaryEn = String(release.summary?.['en-US'] || '').trim();
          const highlightsZh = Array.isArray(release.highlights?.['zh-CN'])
            ? release.highlights['zh-CN'].map((item) => String(item || '').trim()).filter(Boolean)
            : [];
          const highlightsEn = Array.isArray(release.highlights?.['en-US'])
            ? release.highlights['en-US'].map((item) => String(item || '').trim()).filter(Boolean)
            : [];
          const changelogUrl = String(release.changelogUrl || notes.changelogUrl || '').trim();

          const bodyLines = [];
          if (summaryEn) {
            bodyLines.push("## What's New", "", summaryEn);
            if (highlightsEn.length > 0) {
              bodyLines.push("", ...highlightsEn.map((item) => `- ${item}`));
            }
            bodyLines.push("");
          }
          if (summaryZh) {
            bodyLines.push("## 更新内容", "", summaryZh);
            if (highlightsZh.length > 0) {
              bodyLines.push("", ...highlightsZh.map((item) => `- ${item}`));
            }
            bodyLines.push("");
          }
          if (changelogUrl) {
            bodyLines.push(`[Full Changelog](${changelogUrl})`);
          }

          const body = bodyLines.join('\n').trim();
          const outputPath = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(outputPath, `release_name=Qollect v${version}\n`);
          fs.appendFileSync(outputPath, `release_body<<__QOLLECT_BODY__\n${body}\n__QOLLECT_BODY__\n`);
          EOF
        env:
          VERSION: ${{ steps.version.outputs.version_num }}

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.version }}
          releaseName: ${{ steps.release_meta.outputs.release_name }}
          releaseBody: ${{ steps.release_meta.outputs.release_body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonKeepUniversal: false
          args: ""

  upload-r2:
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_num=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p r2-upload/releases/${{ steps.version.outputs.version }}
          cd r2-upload/releases/${{ steps.version.outputs.version }}

          # Download Windows assets from GitHub Release
          gh release download "${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.exe" \
            --pattern "*.exe.sig" \
            --pattern "*.msi" \
            --pattern "*.msi.sig" \
            --pattern "*.zip" \
            --pattern "*.zip.sig" \
            --clobber || true

          echo "Downloaded assets:"
          ls -la

      - name: Generate R2 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          R2_BASE="https://dl.zongqir.com/releases/${VERSION}"

          # Download the tauri-generated latest.json from GitHub Release
          gh release download "$VERSION" \
            --repo "${{ github.repository }}" \
            --pattern "latest.json" \
            --dir r2-upload/tmp \
            --clobber

          # Replace GitHub download URLs with R2 URLs
          sed -E "s|https://github\.com/[^/]+/[^/]+/releases/download/[^/]+/|${R2_BASE}/|g" \
            r2-upload/tmp/latest.json > r2-upload/latest.json

          echo "Generated latest.json:"
          cat r2-upload/latest.json

      - name: Prepare release-notes.json for R2
        run: |
          cp src/data/release-notes.json r2-upload/release-notes.json

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUCKET="qollect"

          # Upload latest.json
          wrangler r2 object put "${BUCKET}/latest.json" \
            --file r2-upload/latest.json \
            --content-type "application/json" \
            --remote

          wrangler r2 object put "${BUCKET}/release-notes.json" \
            --file r2-upload/release-notes.json \
            --content-type "application/json" \
            --remote

          # Upload all release assets (versioned + latest alias)
          for file in r2-upload/releases/${VERSION}/*; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            echo "Uploading versioned: $filename"
            wrangler r2 object put "${BUCKET}/releases/${VERSION}/${filename}" \
              --file "$file" \
              --remote

            # Upload fixed latest alias (e.g. Qollect_0.6.3_x64-setup.exe -> Qollect_x64-setup.exe)
            latest_filename=$(echo "$filename" | sed -E 's/_[0-9]+\.[0-9]+\.[0-9]+//')
            echo "Uploading latest alias: releases/latest/${latest_filename}"
            wrangler r2 object put "${BUCKET}/releases/latest/${latest_filename}" \
              --file "$file" \
              --cache-control "no-cache, must-revalidate" \
              --remote
          done

          echo "R2 upload complete: https://dl.zongqir.com/latest.json and https://dl.zongqir.com/releases/latest/Qollect_x64-setup.exe"
