name: Warm Rust Cache

on:
  push:
    branches:
      - dev-fav
    paths:
      - 'src-tauri/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/warm-cache.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

jobs:
  warm-cache:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Disable Windows Defender
        shell: powershell
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath (Get-Location).Path -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction SilentlyContinue

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies & build frontend
        run: |
          npm ci
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            tools/check-updater-signature -> target
          shared-key: "qollect-windows-build"
          save-if: true

      - name: Prebuild updater signature verifier
        shell: bash
        run: |
          cargo build --manifest-path tools/check-updater-signature/Cargo.toml

      - name: Prebuild Rust dependencies with Tauri CLI
        shell: bash
        run: |
          npx tauri build --no-bundle

      - name: Commit updated Cargo.lock if changed
        shell: bash
        run: |
          if [ -n "$(git status --porcelain src-tauri/Cargo.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src-tauri/Cargo.lock
            git commit -m "chore(deps): sync locked dependencies in Cargo.lock [skip ci]"
            git push origin dev-fav
          fi
