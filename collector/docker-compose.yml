services:
  collector:
    image: ${QOLLECT_IMAGE:-ghcr.io/zongqir/qollect-collector:latest}
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QOLLECT_PORT:-18080}:8080"
    environment:
      QOLLECT_TOKEN: ${QOLLECT_TOKEN:?Set QOLLECT_TOKEN in .env}
      QOLLECT_RETENTION_DAYS: ${QOLLECT_RETENTION_DAYS:-30}
      QOLLECT_MAX_TEXT_CHARS: ${QOLLECT_MAX_TEXT_CHARS:-2000}
      QOLLECT_PREVIEW_CHARS: ${QOLLECT_PREVIEW_CHARS:-200}
      QOLLECT_TIMEZONE: ${QOLLECT_TIMEZONE:-UTC}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
