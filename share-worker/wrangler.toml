name = "qollect-share-relay"
main = "worker.js"
compatibility_date = "2024-04-01"
account_id = "1d246ee55daba8adf9b06a6ec030d1c5"

# 绑定 Cloudflare KV 用于临时密文暂存（10 分钟自动过期）
[[kv_namespaces]]
binding = "SHARE_KV"
id = "030ce2fe1d8b468b83cb1554aed6e05f"

# 自定义域名绑定
routes = [
  { pattern = "qollect-share.zongqir.com", custom_domain = true }
]
