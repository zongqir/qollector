[build]
incremental = true
jobs = 8

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[profile.dev]
incremental = true
opt-level = 0

[profile.release]
incremental = true
opt-level = 3
lto = "thin"
codegen-units = 16
