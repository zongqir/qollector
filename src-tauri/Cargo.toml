[package]
name = "clipbox"
version = "0.1.0"
edition = "2021"

[lib]
name = "clipbox"
path = "src/lib.rs"

[[bin]]
name = "clipbox"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools", "image-png", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-std"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros"], default-features = false }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
sha2 = "0.10"
blake3 = "1"
url = "2.5"
thiserror = "1"
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
base64 = "0.22"
warp = "0.3"
sysinfo = "0.32"
once_cell = "1.20"
zip = "2"
aes-gcm = "0.10"
rfd = "0.15"
zstd = "0.13"
jieba-rs = { version = "0.8", default-features = false, features = ["default-dict"] }
qrcode = { version = "0.14", default-features = false }
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2"

# Windows specific
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
] }
drag = "2.1.0"

# Linux specific
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

# macOS specific
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
