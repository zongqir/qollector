[package]
name = "qollect"
version = "0.2.4"
edition = "2021"

[lib]
name = "qollect"
path = "src/lib.rs"

[[bin]]
name = "qollect"
path = "src/main.rs"

[[bin]]
name = "check-updater-signature"
path = "src/bin/check_updater_signature.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-std"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros"], default-features = false }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
blake3 = "1"
url = "2.5"
thiserror = "1"
parking_lot = "0.12"
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
fast_image_resize = { version = "5", features = ["image"] }
arboard = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
base64 = "0.22"
warp = "0.3"
sysinfo = "0.32"
zip = "2"
aes-gcm = "0.10"
rfd = "0.15"
zstd = "0.13"
jieba-rs = { version = "0.8", default-features = false, features = ["default-dict"] }
qrcode = { version = "0.14", default-features = false }
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
hostname = "0.4"
minisign-verify = "0.2.4"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2"

# Windows specific
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
    "Foundation",
] }
drag = "2.1.0"
winreg = "0.55"

# Linux specific
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

# macOS specific
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
drag = "2.1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "s"
